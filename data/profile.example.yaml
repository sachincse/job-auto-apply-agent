job_search:
  keywords:
    - "machine learning engineer"
    - "senior ML engineer"
    - "deep learning engineer"
    - "NLP engineer"
    - "AI engineer"
    - "MLOps engineer"
    - "generative AI engineer"
    - "LLM engineer"
    - "computer vision engineer"
    - "data scientist senior"
    - "applied scientist"
    - "ML lead"
    - "AI/ML engineer"
  location_targets:
    - name: "Berlin"
      country: "Germany"
      adzuna_country: "de"
      keywords_extra: ["Berlin", "Germany", "EU"]
      visa_note: "EU Blue Card available for skilled workers"
      salary_range: "€65,000 - €120,000"
    - name: "Canada"
      country: "Canada"
      adzuna_country: "ca"
      keywords_extra: ["Canada", "Toronto", "Vancouver", "Montreal"]
      visa_note: "Express Entry / Global Talent Stream"
      salary_range: "CAD 90,000 - 170,000"
    - name: "Remote"
      country: "Global"
      adzuna_country: "us"
      keywords_extra: ["remote", "worldwide", "global"]
      visa_note: "No visa needed"
      salary_range: "$100,000 - $200,000"
  # Salary in EUR (Berlin market — primary target)
  salary_min_eur: 90000       # Minimum acceptable for married couple in Berlin
  salary_target_eur: 110000   # Realistic target (Senior ML + 8 YoE)
  salary_ideal_eur: 130000    # Top tier (BMW, Meta, Google, Zalando senior roles)
  current_ctc_inr: 5500000    # ₹55L FIXED (clarified by user)
  # Keep USD for Adzuna compatibility
  salary_min: 95000           # USD equivalent for Adzuna filter
  salary_max: 200000
  currency: "EUR"
  job_type: "any"   # full-time, part-time, contract, freelance — all OK
  include_part_time: true
  part_time_keywords:
    - "part time machine learning"
    - "part time AI engineer"
    - "freelance ML engineer"
    - "contract AI engineer"
    - "ML consultant"
  experience_level: "senior"
  must_sponsor_visa: true
  platforms:
