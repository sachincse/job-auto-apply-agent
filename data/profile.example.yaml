scheduler:
  timezone: "Asia/Kolkata"
  jobs:
    # === Hybrid daily flow (Option A) ===
    search:
      cron: "0 8 * * *"         # 8 AM IST: refresh job DB across all platforms
      enabled: true
    email_apply:
      cron: "30 8 * * *"        # 8:30 AM IST: send direct-email applications
      enabled: true
    linkedin_apply:
      cron: "0 10 * * *"        # 10 AM IST: LinkedIn Easy Apply (15-20 applications/day)
      enabled: true
    join_apply:
      cron: "30 11 * * *"       # 11:30 AM IST: join.com batch (Arbeitnow visa-sponsored ATS)
      enabled: true
    linkedin_hr_connect:
      cron: "0 12 * * *"        # 12 PM IST: harvest ~25 Berlin AI recruiters
      enabled: true
    indeed_apply:
      cron: "0 14 * * *"        # 2 PM IST: Indeed Easy Apply
      enabled: false             # DEFERRED: per-employer ATS too varied
    hybrid_report:
      cron: "0 20 * * *"        # 8 PM IST: send daily HTML email report with cover letters
      enabled: true

    # === Reliability tasks ===
    weekly_report:
      cron: "0 20 * * 0"        # Sunday 8 PM IST: weekly summary
      enabled: true
    study_plan:
      cron: "0 7 * * 1"         # Monday 7 AM IST: refresh study plan
      enabled: true
    career_advice:
      cron: "0 8 * * 1"         # Monday 8 AM IST: career insights
      enabled: true

    # === Disabled (LinkedIn risk + Naukri headless detection) ===
    apply:
      cron: "0 9 * * *"
      enabled: false             # Disabled — browser apply is unreliable
      max_per_run: 10
    linkedin_scan:
      cron: "0 */6 * * *"
      enabled: false             # Disabled — LinkedIn anti-bot risk
    check_messages:
      cron: "0 */2 * * *"
      enabled: false             # Disabled — LinkedIn anti-bot risk
    scan_meetings:
      cron: "*/15 * * * *"
      enabled: false             # Optional — re-enable if you want meeting recordings
    daily_report:
      cron: "0 20 * * *"
      enabled: false             # Replaced by hybrid_report
